name: Design rules
on: [push, pull_request]
permissions:
  contents: read
jobs:
  design-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check-design-rules.py
      - run: python scripts/test-design-rules.py
